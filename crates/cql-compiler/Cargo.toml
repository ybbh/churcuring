[package]
name = "cql-compiler"
version = "0.1.0"
edition = "2021"
description = "CQL compiler library: parse, resolve, effect/type/termination checks, desugar, optimize, codegen"
license = "MIT OR Apache-2.0"

[dependencies]
tree-sitter = { workspace = true }
tree-sitter-cql = { path = "../tree-sitter-cql" }
cql-runtime = { path = "../cql-runtime" }
cql-mc = { path = "../cql-mc", default-features = false, features = ["stateright"] }
askama = { workspace = true }
miette = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
